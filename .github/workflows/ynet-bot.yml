name: Ynet News to Telegram

on:
  schedule:
    - cron: '*/10 * * * *'   # هر ۱۰ دقیقه
  workflow_dispatch:          # برای اجرای دستی

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌ها
        run: |
          pip install requests beautifulsoup4 deep-translator

      - name: بازیابی کش (با کلید جدید)
        uses: actions/cache@v3
        with:
          path: sent_news.json
          key: ynet-sent-cache   # کلید جدید

      - name: اجرای ربات خبری
        run: python news_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

name: Ynet News to Telegram

on:
  schedule:
    - cron: '*/10 * * * *'   # هر ۱۰ دقیقه
  workflow_dispatch:          # برای اجرای دستی

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    # دسترسی لازم برای Commit و Push فایل sent_news.json
    permissions:
      contents: write

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌ها
        run: |
          pip install requests beautifulsoup4 deep-translator

      - name: اجرای ربات خبری
        run: python news_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: ذخیره تغییرات لیست اخبار ارسال‌شده
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent_news.json [skip ci]" && git push)

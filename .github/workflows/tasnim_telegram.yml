name: Tasnim News to Telegram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌ها
        run: |
          pip install requests beautifulsoup4

      - name: بازیابی کش خبرهای تکراری
        uses: actions/cache@v3
        with:
          path: sent_news.json
          key: tasnim-sent-news

      - name: اجرای ربات خبری
        run: python news_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
